# Everything here runs without a phone, a model key or any secret.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: lint, unit tests, tool snapshots
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Includes server/test/tool-snapshots.test.mjs: any change to the tools
      # Claude sees must arrive with an updated snapshot.
      - run: npm test

  simulated-phone:
    # The real supervisor and the real server against a simulated phone. Linux
    # on purpose: two phones need two loopback addresses and an unreachable
    # phone needs connects that time out, and only Linux offers both.
    name: lifecycle and whole-path tests (simulated phone)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:lifecycle
      - run: npm run test:e2e

  conformance:
    # The official MCP conformance suite against the real server. Scenarios
    # for features this server does not offer are listed, with reasons, in
    # e2e/conformance-expected-failures.yml.
    name: MCP conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:conformance

  runner:
    # Compiles the on-phone runner for the simulator: no signing, no device.
    name: runner compiles
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: runner/build.sh --simulator
