<svg xmlns="http://www.w3.org/2000/svg" width="960" height="396" viewBox="0 0 960 396">
<title>The four layers that let a server drive an unplugged iPhone</title>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .frame { fill: #FFFFFF; stroke: #D0D7DE; }
  .box   { fill: #FFFFFF; stroke: #D0D7DE; }
  .h  { fill: #1F2328; font-weight: 600; }
  .s  { fill: #59636E; }
  .k  { fill: #59636E; font-weight: 600; letter-spacing: .06em; }
  .ln { stroke: #8C959F; fill: none; }
  .ah { fill: #8C959F; }
  .blue   { fill: #0969DA; } .blueS   { stroke: #0969DA; }
  .green  { fill: #1A7F37; } .greenS  { stroke: #1A7F37; }
  .purple { fill: #8250DF; } .purpleS { stroke: #8250DF; }
  .orange { fill: #BC4C00; } .orangeS { stroke: #BC4C00; }
  .gray   { fill: #59636E; } .grayS   { stroke: #8C959F; }
  .zone { fill-opacity: .06; stroke-opacity: .45; }
  .chipT { fill: #FFFFFF; font-weight: 600; }
  @media (prefers-color-scheme: dark) {
    .frame { fill: #0D1117; stroke: #30363D; }
    .box   { fill: #161B22; stroke: #3D444D; }
    .h  { fill: #F0F6FC; } .s, .k { fill: #9198A1; }
    .ln { stroke: #6E7681; } .ah { fill: #6E7681; }
    .blue { fill: #4493F8; } .blueS { stroke: #4493F8; }
    .green { fill: #3FB950; } .greenS { stroke: #3FB950; }
    .purple { fill: #AB7DF8; } .purpleS { stroke: #AB7DF8; }
    .orange { fill: #F0883E; } .orangeS { stroke: #F0883E; }
    .gray { fill: #9198A1; } .grayS { stroke: #6E7681; }
    .zone { fill-opacity: .10; }
    .chipT { fill: #0D1117; }
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="frame" x="0.5" y="0.5" width="959" height="395" rx="16"/>
<text x="40" y="46" class="h" font-size="20" text-anchor="start" >Four layers, each resting on the one below</text>
<rect class="box" x="40" y="72" width="880" height="58" rx="12"/>
<rect class="purple" x="40" y="72" width="6" height="58" rx="3"/>
<text x="76" y="108" class="purple" font-size="22" text-anchor="middle" font-weight="700">4</text>
<text x="118" y="108" class="h" font-size="17" text-anchor="start" >Runner</text>
<text x="300" y="108" class="s" font-size="15" text-anchor="start" >XCTest app on the iPhone</text>
<text x="560" y="108" class="s" font-size="15" text-anchor="start" >taps, types, screenshots</text>
<rect class="box" x="40" y="142" width="880" height="58" rx="12"/>
<rect class="purple" x="40" y="142" width="6" height="58" rx="3"/>
<text x="76" y="178" class="purple" font-size="22" text-anchor="middle" font-weight="700">3</text>
<text x="118" y="178" class="h" font-size="17" text-anchor="start" >Session</text>
<text x="300" y="178" class="s" font-size="15" text-anchor="start" >go-ios, patched</text>
<text x="560" y="178" class="s" font-size="15" text-anchor="start" >keeps the runner alive</text>
<line class="orangeS" x1="40" y1="218" x2="680" y2="218" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="920" y="223" class="orange" font-size="13" text-anchor="end" font-weight="600">ended with each task ↑ · kept warm ↓</text>
<rect class="box" x="40" y="236" width="880" height="58" rx="12"/>
<rect class="blue" x="40" y="236" width="6" height="58" rx="3"/>
<text x="76" y="272" class="blue" font-size="22" text-anchor="middle" font-weight="700">2</text>
<text x="118" y="272" class="h" font-size="17" text-anchor="start" >Tunnel</text>
<text x="300" y="272" class="s" font-size="15" text-anchor="start" >pymobiledevice3</text>
<text x="560" y="272" class="s" font-size="15" text-anchor="start" >the encrypted channel to iOS</text>
<rect class="box" x="40" y="306" width="880" height="58" rx="12"/>
<rect class="green" x="40" y="306" width="6" height="58" rx="3"/>
<text x="76" y="342" class="green" font-size="22" text-anchor="middle" font-weight="700">1</text>
<text x="118" y="342" class="h" font-size="17" text-anchor="start" >Network</text>
<text x="300" y="342" class="s" font-size="15" text-anchor="start" >Tailscale</text>
<text x="560" y="342" class="s" font-size="15" text-anchor="start" >reaches the phone on any network</text>
</svg>
