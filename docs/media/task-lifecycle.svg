<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>One task, start to finish</title>
  <rect x="0.5" y="0.5" width="959" height="359" rx="16" fill="#FBFAF7" stroke="#E5E1D8"/>
  <text x="32" y="44" font-size="17" font-weight="600" fill="#1F2328">One task, start to finish</text>
  <text x="32" y="68" font-size="13" fill="#57606A">The "Automation Running" banner is on the phone only while an agent is driving it.</text>

  <line x1="96" y1="128" x2="864" y2="128" stroke="#D0D7DE" stroke-width="2"/>
  <!-- steps: centers at 96, 249.6, 403.2, 556.8, 710.4, 864 -->
  <g font-size="12.5" text-anchor="middle">
    <circle cx="96" cy="128" r="15" fill="#FFFFFF" stroke="#57606A" stroke-width="2"/><text x="96" y="133" font-weight="700" fill="#1F2328">1</text>
    <text x="96" y="168" font-weight="600" fill="#1F2328">You ask</text>
    <text x="96" y="186" fill="#57606A">in the chat</text>

    <circle cx="250" cy="128" r="15" fill="#FFFFFF" stroke="#8250DF" stroke-width="2"/><text x="250" y="133" font-weight="700" fill="#8250DF">2</text>
    <text x="250" y="168" font-weight="600" fill="#1F2328">Start automation</text>
    <text x="250" y="186" fill="#57606A">tunnel, then session,</text>
    <text x="250" y="202" fill="#57606A">then runner</text>

    <circle cx="403" cy="128" r="15" fill="#FFFFFF" stroke="#8250DF" stroke-width="2"/><text x="403" y="133" font-weight="700" fill="#8250DF">3</text>
    <text x="403" y="168" font-weight="600" fill="#1F2328">Get the screen ready</text>
    <text x="403" y="186" fill="#57606A">stop if it is locked;</text>
    <text x="403" y="202" fill="#57606A">swipe away a banner</text>
    <text x="403" y="218" fill="#57606A">covering the top</text>

    <circle cx="557" cy="128" r="15" fill="#FFFFFF" stroke="#8250DF" stroke-width="2"/><text x="557" y="133" font-weight="700" fill="#8250DF">4</text>
    <text x="557" y="168" font-weight="600" fill="#1F2328">The agent works</text>
    <text x="557" y="186" fill="#57606A">look, decide, act,</text>
    <text x="557" y="202" fill="#57606A">repeat; progress shows</text>
    <text x="557" y="218" fill="#57606A">in the chat</text>

    <circle cx="710" cy="128" r="15" fill="#FFFFFF" stroke="#8250DF" stroke-width="2"/><text x="710" y="133" font-weight="700" fill="#8250DF">5</text>
    <text x="710" y="168" font-weight="600" fill="#1F2328">Hand back</text>
    <text x="710" y="186" fill="#57606A">the Claude app comes</text>
    <text x="710" y="202" fill="#57606A">to the front with</text>
    <text x="710" y="218" fill="#57606A">the answer</text>

    <circle cx="864" cy="128" r="15" fill="#FFFFFF" stroke="#1A7F37" stroke-width="2"/><text x="864" y="133" font-weight="700" fill="#1A7F37">6</text>
    <text x="864" y="168" font-weight="600" fill="#1F2328">Put it down</text>
    <text x="864" y="186" fill="#57606A">runner stopped,</text>
    <text x="864" y="202" fill="#57606A">banner gone</text>
  </g>

  <!-- bands -->
  <rect x="236" y="250" width="628" height="28" rx="14" fill="#F1EBFC" stroke="#D8C8F6"/>
  <text x="550" y="269" text-anchor="middle" font-size="12.5" font-weight="600" fill="#6639BA">"Automation Running" banner on the phone</text>
  <rect x="236" y="290" width="692" height="28" rx="14" fill="#E8F1FB" stroke="#C6DBF2"/>
  <text x="582" y="309" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0B5CAD">Tunnel up, and kept warm for the next task →</text>
  <text x="32" y="341" font-size="12" fill="#57606A">However the task ends (finished, failed, stopped in the chat, stopped on the phone, connection lost), step 6 runs.</text>
</svg>
