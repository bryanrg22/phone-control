<svg xmlns="http://www.w3.org/2000/svg" width="960" height="324" viewBox="0 0 960 324">
<title>One task from start to finish</title>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .frame { fill: #FFFFFF; stroke: #D0D7DE; }
  .box   { fill: #FFFFFF; stroke: #D0D7DE; }
  .h  { fill: #1F2328; font-weight: 600; }
  .s  { fill: #59636E; }
  .k  { fill: #59636E; font-weight: 600; letter-spacing: .06em; }
  .ln { stroke: #8C959F; fill: none; }
  .ah { fill: #8C959F; }
  .blue   { fill: #0969DA; } .blueS   { stroke: #0969DA; }
  .green  { fill: #1A7F37; } .greenS  { stroke: #1A7F37; }
  .purple { fill: #8250DF; } .purpleS { stroke: #8250DF; }
  .orange { fill: #BC4C00; } .orangeS { stroke: #BC4C00; }
  .gray   { fill: #59636E; } .grayS   { stroke: #8C959F; }
  .zone { fill-opacity: .06; stroke-opacity: .45; }
  .chipT { fill: #FFFFFF; font-weight: 600; }
  @media (prefers-color-scheme: dark) {
    .frame { fill: #0D1117; stroke: #30363D; }
    .box   { fill: #161B22; stroke: #3D444D; }
    .h  { fill: #F0F6FC; } .s, .k { fill: #9198A1; }
    .ln { stroke: #6E7681; } .ah { fill: #6E7681; }
    .blue { fill: #4493F8; } .blueS { stroke: #4493F8; }
    .green { fill: #3FB950; } .greenS { stroke: #3FB950; }
    .purple { fill: #AB7DF8; } .purpleS { stroke: #AB7DF8; }
    .orange { fill: #F0883E; } .orangeS { stroke: #F0883E; }
    .gray { fill: #9198A1; } .grayS { stroke: #6E7681; }
    .zone { fill-opacity: .10; }
    .chipT { fill: #0D1117; }
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="frame" x="0.5" y="0.5" width="959" height="323" rx="16"/>
<text x="40" y="46" class="h" font-size="20" text-anchor="start" >One task, start to finish</text>
<circle class="box grayS" cx="100" cy="110" r="22" stroke-width="2.5"/>
<text x="100" y="116" class="gray" font-size="17" text-anchor="middle" font-weight="700">1</text>
<text x="100" y="160" class="k" font-size="12" text-anchor="middle" >YOU</text>
<text x="100" y="184" class="h" font-size="15" text-anchor="middle" >Ask Claude</text>
<text x="100" y="204" class="h" font-size="15" text-anchor="middle" >in the chat</text>
<line class="ln" x1="128" y1="110" x2="224" y2="110" stroke-width="2" marker-end="url(#a)"/>
<circle class="box grayS" cx="252" cy="110" r="22" stroke-width="2.5"/>
<text x="252" y="116" class="gray" font-size="17" text-anchor="middle" font-weight="700">2</text>
<text x="252" y="160" class="k" font-size="12" text-anchor="middle" >CLAUDE</text>
<text x="252" y="184" class="h" font-size="15" text-anchor="middle" >Calls your</text>
<text x="252" y="204" class="h" font-size="15" text-anchor="middle" >server</text>
<line class="ln" x1="280" y1="110" x2="376" y2="110" stroke-width="2" marker-end="url(#a)"/>
<circle class="box purpleS" cx="404" cy="110" r="22" stroke-width="2.5"/>
<text x="404" y="116" class="purple" font-size="17" text-anchor="middle" font-weight="700">3</text>
<text x="404" y="160" class="k" font-size="12" text-anchor="middle" >SERVER</text>
<text x="404" y="184" class="h" font-size="15" text-anchor="middle" >Starts</text>
<text x="404" y="204" class="h" font-size="15" text-anchor="middle" >automation</text>
<line class="ln" x1="432" y1="110" x2="528" y2="110" stroke-width="2" marker-end="url(#a)"/>
<circle class="box purpleS" cx="556" cy="110" r="22" stroke-width="2.5"/>
<text x="556" y="116" class="purple" font-size="17" text-anchor="middle" font-weight="700">4</text>
<text x="556" y="160" class="k" font-size="12" text-anchor="middle" >AGENT</text>
<text x="556" y="184" class="h" font-size="15" text-anchor="middle" >Looks, decides,</text>
<text x="556" y="204" class="h" font-size="15" text-anchor="middle" >acts, repeats</text>
<line class="ln" x1="584" y1="110" x2="680" y2="110" stroke-width="2" marker-end="url(#a)"/>
<circle class="box purpleS" cx="708" cy="110" r="22" stroke-width="2.5"/>
<text x="708" y="116" class="purple" font-size="17" text-anchor="middle" font-weight="700">5</text>
<text x="708" y="160" class="k" font-size="12" text-anchor="middle" >SERVER</text>
<text x="708" y="184" class="h" font-size="15" text-anchor="middle" >Sends the</text>
<text x="708" y="204" class="h" font-size="15" text-anchor="middle" >answer back</text>
<line class="ln" x1="736" y1="110" x2="832" y2="110" stroke-width="2" marker-end="url(#a)"/>
<circle class="box greenS" cx="860" cy="110" r="22" stroke-width="2.5"/>
<text x="860" y="116" class="green" font-size="17" text-anchor="middle" font-weight="700">6</text>
<text x="860" y="160" class="k" font-size="12" text-anchor="middle" >SERVER</text>
<text x="860" y="184" class="h" font-size="15" text-anchor="middle" >Stops</text>
<text x="860" y="204" class="h" font-size="15" text-anchor="middle" >automation</text>
<rect class="purple purpleS zone" x="344" y="232" width="576" height="36" rx="18"/>
<text x="632.0" y="255" class="purple" font-size="14" text-anchor="middle" font-weight="600">“Automation Running” shows on the phone only during these steps</text>
<text x="40" y="302" class="s" font-size="13" text-anchor="start" >However the task ends (done, failed, stopped, connection lost), step 6 runs.</text>
</svg>
