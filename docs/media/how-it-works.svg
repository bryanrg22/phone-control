<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330">
<title>How a task gets from Claude to your iPhone</title>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .frame { fill: #FFFFFF; stroke: #D0D7DE; }
  .box   { fill: #FFFFFF; stroke: #D0D7DE; }
  .h  { fill: #1F2328; font-weight: 600; }
  .s  { fill: #59636E; }
  .k  { fill: #59636E; font-weight: 600; letter-spacing: .06em; }
  .ln { stroke: #8C959F; fill: none; }
  .ah { fill: #8C959F; }
  .blue   { fill: #0969DA; } .blueS   { stroke: #0969DA; }
  .green  { fill: #1A7F37; } .greenS  { stroke: #1A7F37; }
  .purple { fill: #8250DF; } .purpleS { stroke: #8250DF; }
  .orange { fill: #BC4C00; } .orangeS { stroke: #BC4C00; }
  .gray   { fill: #59636E; } .grayS   { stroke: #8C959F; }
  .zone { fill-opacity: .06; stroke-opacity: .45; }
  .chipT { fill: #FFFFFF; font-weight: 600; }
  @media (prefers-color-scheme: dark) {
    .frame { fill: #0D1117; stroke: #30363D; }
    .box   { fill: #161B22; stroke: #3D444D; }
    .h  { fill: #F0F6FC; } .s, .k { fill: #9198A1; }
    .ln { stroke: #6E7681; } .ah { fill: #6E7681; }
    .blue { fill: #4493F8; } .blueS { stroke: #4493F8; }
    .green { fill: #3FB950; } .greenS { stroke: #3FB950; }
    .purple { fill: #AB7DF8; } .purpleS { stroke: #AB7DF8; }
    .orange { fill: #F0883E; } .orangeS { stroke: #F0883E; }
    .gray { fill: #9198A1; } .grayS { stroke: #6E7681; }
    .zone { fill-opacity: .10; }
    .chipT { fill: #0D1117; }
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="frame" x="0.5" y="0.5" width="959" height="329" rx="16"/>
<rect class="gray grayS zone" x="24" y="56" width="200" height="212" rx="14"/>
<text x="124" y="42" class="k" font-size="13" text-anchor="middle" >CLAUDE</text>
<rect class="box" x="44" y="96" width="160" height="132" rx="12"/>
<text x="124" y="150" class="h" font-size="17" text-anchor="middle" >Claude app</text>
<text x="124" y="174" class="s" font-size="14" text-anchor="middle" >you ask in chat,</text>
<text x="124" y="194" class="s" font-size="14" text-anchor="middle" >on phone or desktop</text>
<rect class="blue blueS zone" x="314" y="56" width="384" height="212" rx="14"/>
<text x="506" y="42" class="k" font-size="13" text-anchor="middle" >YOUR SERVER · NODE.JS ON LINUX</text>
<rect class="box" x="330" y="88" width="112" height="118" rx="12"/>
<text x="386" y="128" class="h" font-size="17" text-anchor="middle" >server</text>
<text x="386" y="154" class="s" font-size="13" text-anchor="middle" >the tools</text>
<text x="386" y="172" class="s" font-size="13" text-anchor="middle" >Claude calls</text>
<rect class="box" x="450" y="88" width="112" height="118" rx="12"/>
<text x="506" y="128" class="h" font-size="17" text-anchor="middle" >device</text>
<text x="506" y="154" class="s" font-size="13" text-anchor="middle" >starts and stops</text>
<text x="506" y="172" class="s" font-size="13" text-anchor="middle" >automation</text>
<rect class="box" x="570" y="88" width="112" height="118" rx="12"/>
<text x="626" y="128" class="h" font-size="17" text-anchor="middle" >agent</text>
<text x="626" y="154" class="s" font-size="13" text-anchor="middle" >looks, decides,</text>
<text x="626" y="172" class="s" font-size="13" text-anchor="middle" >taps and types</text>
<text x="506" y="240" class="s" font-size="13" text-anchor="middle" >the agent runs GPT, Claude, Gemini, Jev or the Decisions API</text>
<rect class="green greenS zone" x="788" y="56" width="148" height="212" rx="14"/>
<text x="862" y="42" class="k" font-size="13" text-anchor="middle" >YOUR IPHONE</text>
<rect class="box" x="804" y="96" width="116" height="132" rx="12"/>
<text x="862" y="140" class="h" font-size="17" text-anchor="middle" >runner</text>
<text x="862" y="166" class="s" font-size="13" text-anchor="middle" >XCTest app:</text>
<text x="862" y="184" class="s" font-size="13" text-anchor="middle" >taps, types,</text>
<text x="862" y="202" class="s" font-size="13" text-anchor="middle" >screenshots</text>
<line class="ln" x1="208" y1="162" x2="326" y2="162" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="267" y="148" class="s" font-size="13" text-anchor="middle" >MCP · HTTPS</text>
<text x="267" y="186" class="s" font-size="12" text-anchor="middle" >Tailscale Funnel</text>
<line class="ln" x1="686" y1="162" x2="800" y2="162" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="743" y="148" class="s" font-size="13" text-anchor="middle" >Tailscale</text>
<text x="743" y="186" class="s" font-size="12" text-anchor="middle" >VPN</text>
<text x="480" y="304" class="s" font-size="13" text-anchor="middle" >The device part reaches the phone with pymobiledevice3 and a patched go-ios. No cable, no Mac, no app to keep open.</text>
</svg>
