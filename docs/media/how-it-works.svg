<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How a task gets from the Claude app to your iPhone</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606A"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="419" rx="16" fill="#FBFAF7" stroke="#E5E1D8"/>

  <!-- zone: Anthropic -->
  <rect x="24" y="64" width="196" height="232" rx="12" fill="#F3F1EC" stroke="#E0DCD2"/>
  <text x="122" y="52" text-anchor="middle" font-size="13" font-weight="600" fill="#57606A" letter-spacing="0.4">CLAUDE</text>
  <!-- zone: your server -->
  <rect x="300" y="64" width="360" height="232" rx="12" fill="#EEF4FD" stroke="#CFDDF3"/>
  <text x="480" y="52" text-anchor="middle" font-size="13" font-weight="600" fill="#3B5B8C" letter-spacing="0.4">YOUR SERVER</text>
  <!-- zone: your iPhone -->
  <rect x="740" y="64" width="196" height="232" rx="12" fill="#EEF7F0" stroke="#CDE6D3"/>
  <text x="838" y="52" text-anchor="middle" font-size="13" font-weight="600" fill="#2E6B3E" letter-spacing="0.4">YOUR IPHONE</text>

  <!-- Claude -->
  <rect x="44" y="96" width="156" height="72" rx="10" fill="#FFFFFF" stroke="#D0D7DE"/>
  <text x="122" y="126" text-anchor="middle" font-size="15" font-weight="600" fill="#1F2328">Claude</text>
  <text x="122" y="147" text-anchor="middle" font-size="12" fill="#57606A">calls tools from the cloud</text>
  <!-- Claude app -->
  <rect x="44" y="200" width="156" height="72" rx="10" fill="#FFFFFF" stroke="#D0D7DE"/>
  <text x="122" y="230" text-anchor="middle" font-size="15" font-weight="600" fill="#1F2328">You, in the</text>
  <text x="122" y="250" text-anchor="middle" font-size="15" font-weight="600" fill="#1F2328">Claude app</text>
  <line x1="122" y1="198" x2="122" y2="172" stroke="#57606A" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="130" y="189" font-size="11" fill="#57606A">chat</text>

  <!-- server -->
  <rect x="320" y="96" width="320" height="56" rx="10" fill="#FFFFFF" stroke="#B8CCEB"/>
  <text x="340" y="120" font-size="14" font-weight="600" fill="#1F2328">server/</text>
  <text x="340" y="139" font-size="12" fill="#57606A">sign-in, tools, one task at a time, clean-up</text>
  <rect x="320" y="164" width="152" height="112" rx="10" fill="#FFFFFF" stroke="#B8CCEB"/>
  <text x="336" y="188" font-size="14" font-weight="600" fill="#1F2328">device/</text>
  <text x="336" y="207" font-size="12" fill="#57606A">builds the tunnel,</text>
  <text x="336" y="223" font-size="12" fill="#57606A">starts and stops the</text>
  <text x="336" y="239" font-size="12" fill="#57606A">session, reads lock</text>
  <text x="336" y="255" font-size="12" fill="#57606A">and network state</text>
  <rect x="488" y="164" width="152" height="112" rx="10" fill="#FFFFFF" stroke="#B8CCEB"/>
  <text x="504" y="188" font-size="14" font-weight="600" fill="#1F2328">agent/</text>
  <text x="504" y="207" font-size="12" fill="#57606A">screenshot → ask a</text>
  <text x="504" y="223" font-size="12" fill="#57606A">model → tap, type,</text>
  <text x="504" y="239" font-size="12" fill="#57606A">swipe → repeat</text>

  <!-- iPhone -->
  <rect x="760" y="96" width="156" height="180" rx="22" fill="#FFFFFF" stroke="#B9DCC3"/>
  <rect x="808" y="106" width="60" height="8" rx="4" fill="#E3EFE6"/>
  <text x="838" y="160" text-anchor="middle" font-size="15" font-weight="600" fill="#1F2328">runner</text>
  <text x="838" y="180" text-anchor="middle" font-size="12" fill="#57606A">an app that performs</text>
  <text x="838" y="196" text-anchor="middle" font-size="12" fill="#57606A">taps, typing and</text>
  <text x="838" y="212" text-anchor="middle" font-size="12" fill="#57606A">screenshots, on</text>
  <text x="838" y="228" text-anchor="middle" font-size="12" fill="#57606A">port 22087</text>

  <!-- Claude -> server -->
  <line x1="204" y1="124" x2="316" y2="124" stroke="#57606A" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="260" y="114" text-anchor="middle" font-size="11" fill="#57606A">MCP over</text>
  <text x="260" y="142" text-anchor="middle" font-size="11" fill="#57606A">HTTPS :443</text>
  <!-- server -> phone -->
  <line x1="644" y1="186" x2="756" y2="186" stroke="#57606A" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="644" y1="232" x2="756" y2="232" stroke="#57606A" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="700" y="176" text-anchor="middle" font-size="11" fill="#57606A">start / stop</text>
  <text x="700" y="252" text-anchor="middle" font-size="11" fill="#57606A">actions</text>

  <!-- footer notes -->
  <line x1="24" y1="318" x2="936" y2="318" stroke="#E5E1D8"/>
  <text x="24" y="346" font-size="12.5" fill="#1F2328"><tspan font-weight="600">Public address:</tspan><tspan fill="#57606A"> Tailscale Funnel gives the server an HTTPS address on port 443, the only port Claude connects to.</tspan></text>
  <text x="24" y="370" font-size="12.5" fill="#1F2328"><tspan font-weight="600">Server ↔ iPhone:</tspan><tspan fill="#57606A"> Tailscale, so the server reaches the phone on any network. No cable and no Mac.</tspan></text>
  <text x="24" y="394" font-size="12.5" fill="#1F2328"><tspan font-weight="600">Nothing to keep open on the phone:</tspan><tspan fill="#57606A"> the runner is started for each task and stopped after it.</tspan></text>
</svg>
