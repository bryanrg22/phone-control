<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430">
<title>Three ways the agent can drive the phone: an LLM, a decision model, or a hybrid</title>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .frame { fill: #FFFFFF; stroke: #D0D7DE; }
  .box   { fill: #FFFFFF; stroke: #D0D7DE; }
  .h  { fill: #1F2328; font-weight: 600; }
  .s  { fill: #59636E; }
  .k  { fill: #59636E; font-weight: 600; letter-spacing: .06em; }
  .ln { stroke: #8C959F; fill: none; }
  .ah { fill: #8C959F; }
  .blue   { fill: #0969DA; } .blueS   { stroke: #0969DA; }
  .green  { fill: #1A7F37; } .greenS  { stroke: #1A7F37; }
  .purple { fill: #8250DF; } .purpleS { stroke: #8250DF; }
  .orange { fill: #BC4C00; } .orangeS { stroke: #BC4C00; }
  .gray   { fill: #59636E; } .grayS   { stroke: #8C959F; }
  .zone { fill-opacity: .06; stroke-opacity: .45; }
  .chipT { fill: #FFFFFF; font-weight: 600; }
  @media (prefers-color-scheme: dark) {
    .frame { fill: #0D1117; stroke: #30363D; }
    .box   { fill: #161B22; stroke: #3D444D; }
    .h  { fill: #F0F6FC; } .s, .k { fill: #9198A1; }
    .ln { stroke: #6E7681; } .ah { fill: #6E7681; }
    .blue { fill: #4493F8; } .blueS { stroke: #4493F8; }
    .green { fill: #3FB950; } .greenS { stroke: #3FB950; }
    .purple { fill: #AB7DF8; } .purpleS { stroke: #AB7DF8; }
    .orange { fill: #F0883E; } .orangeS { stroke: #F0883E; }
    .gray { fill: #9198A1; } .grayS { stroke: #6E7681; }
    .zone { fill-opacity: .10; }
    .chipT { fill: #0D1117; }
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="frame" x="0.5" y="0.5" width="959" height="429" rx="16"/>
<text x="40" y="46" class="h" font-size="20" text-anchor="start" >Three ways to drive the phone</text>
<text x="40" y="72" class="s" font-size="14" text-anchor="start" >Each step the agent reads the screen and does one thing. What differs is who chooses.</text>
<rect class="gray grayS zone" x="40" y="96" width="280" height="290" rx="14"/>
<text x="60" y="128" class="h" font-size="18" text-anchor="start" >LLM</text>
<text x="60" y="150" class="s" font-size="13" text-anchor="start" >GPT · Claude · Gemini</text>
<text x="60" y="186" class="s" font-size="15" text-anchor="start" >Gets the screenshot</text>
<text x="60" y="208" class="s" font-size="15" text-anchor="start" >and the element list</text>
<text x="60" y="242" class="s" font-size="15" text-anchor="start" >Writes the next action</text>
<text x="60" y="264" class="s" font-size="15" text-anchor="start" >itself: tap("Save")</text>
<rect class="gray" x="60" y="330" width="96" height="34" rx="17"/>
<text x="108" y="353" class="chipT" font-size="16" text-anchor="middle" >69%</text>
<text x="168" y="352" class="s" font-size="13" text-anchor="start" >of iOSWorld tasks</text>
<rect class="blue blueS zone" x="340" y="96" width="280" height="290" rx="14"/>
<text x="360" y="128" class="h" font-size="18" text-anchor="start" >Decision model</text>
<text x="360" y="150" class="s" font-size="13" text-anchor="start" >Jev · OpenAI Decisions API</text>
<text x="360" y="186" class="s" font-size="15" text-anchor="start" >Gets the element list</text>
<text x="360" y="208" class="s" font-size="15" text-anchor="start" >The agent lists every</text>
<text x="360" y="230" class="s" font-size="15" text-anchor="start" >possible action</text>
<text x="360" y="264" class="s" font-size="15" text-anchor="start" >Picks one, with a</text>
<text x="360" y="286" class="s" font-size="15" text-anchor="start" >probability for each</text>
<rect class="blue" x="360" y="330" width="96" height="34" rx="17"/>
<text x="408" y="353" class="chipT" font-size="16" text-anchor="middle" >0%</text>
<text x="468" y="352" class="s" font-size="13" text-anchor="start" >of iOSWorld tasks</text>
<rect class="purple purpleS zone" x="640" y="96" width="280" height="290" rx="14"/>
<text x="660" y="128" class="h" font-size="18" text-anchor="start" >Hybrid, sticky</text>
<text x="660" y="150" class="s" font-size="13" text-anchor="start" >decision model + LLM</text>
<text x="660" y="186" class="s" font-size="15" text-anchor="start" >The decision model</text>
<text x="660" y="208" class="s" font-size="15" text-anchor="start" >takes the clear steps</text>
<text x="660" y="242" class="s" font-size="15" text-anchor="start" >Unsure, typing, done</text>
<text x="660" y="264" class="s" font-size="15" text-anchor="start" >or stuck: the LLM takes</text>
<text x="660" y="286" class="s" font-size="15" text-anchor="start" >over until it hands back</text>
<rect class="purple" x="660" y="330" width="96" height="34" rx="17"/>
<text x="708" y="353" class="chipT" font-size="16" text-anchor="middle" >65%</text>
<text x="768" y="352" class="s" font-size="13" text-anchor="start" >of iOSWorld tasks</text>
<text x="40" y="412" class="s" font-size="12" text-anchor="start" >Hand-checked passes on iOSWorld’s 27 single-app tasks. LLM = GPT-6 Luna, hybrid = both: 3 trials. Decisions API: 1.</text>
</svg>
